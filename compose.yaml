services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474"   # Toxiproxy REST API — add/remove toxics here
      - "9091:9091"   # Proxy port — callers hit this instead of the app directly
    volumes:
      - ./toxiproxy.json:/toxiproxy.json
    command: ["-config", "/toxiproxy.json", "-host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 1s

  # --- Homework 3: sharded relational store ---
  # Two payment shards (shard0 / shard1) + a separate metadata DB. Each store's
  # payments live on exactly one shard (floorMod(hash(storeId), shard.count)); the
  # import_request aggregate lives only in `meta`.
  shard0:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  shard1:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  meta:
    image: postgres:16
    environment:
      POSTGRES_DB: meta
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d meta"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s
