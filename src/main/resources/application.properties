spring.application.name=cloud

# Toxiproxy (port 9091) proxies to this app itself, so Spring Boot's TCP readiness
# check on 9091 would deadlock (upstream not up yet). Skip the check entirely —
# Toxiproxy starts in <1s so it's always ready before the app context loads.
spring.docker.compose.readiness.wait=never

# Toxiproxy sits in front of this app on port 9091 — callers should use that port
# to route through the proxy and experience injected network conditions.
# To inject latency:  POST http://localhost:8474/proxies/spring-boot-app/toxics
#   {"name":"latency","type":"latency","attributes":{"latency":2000,"jitter":500}}
# To simulate timeout: use type "timeout" with {"timeout":0}
# To reset:            DELETE http://localhost:8474/proxies/spring-boot-app/toxics/latency

# --- Homework 3: sharded relational store + async bulk processing ---

# Sharded payment store. shard.count MUST equal the number of shard.datasources
# entries. Routing is manual: shard = floorMod(hash(storeId), shard.count).
shard.count=2
shard.datasources[0].url=jdbc:postgresql://localhost:5432/payments
shard.datasources[0].username=app
shard.datasources[0].password=app
shard.datasources[1].url=jdbc:postgresql://localhost:5433/payments
shard.datasources[1].username=app
shard.datasources[1].password=app

# Metadata DB (NOT sharded): holds the import_request aggregate, because one bulk
# request can span multiple stores and therefore multiple shards.
meta.datasource.url=jdbc:postgresql://localhost:5434/meta
meta.datasource.username=app
meta.datasource.password=app

# Remote Payments API the async worker POSTs each payment to (reusing the homework-1
# reliability path: Idempotency-Key = payment.id, Store-Id = storeId, capped retries).
remote.base-url=http://localhost:8080

# Background worker cadence and limits.
worker.interval=1000
worker.batch-size=50
worker.max-attempts=10
